  <rect x="5" y="5.5" width="4" height="1.4" rx=".7" fill="#F4A08A"/>
  <circle cx="22" cy="8" r="2" fill="#F7F3E8" stroke="#E2B33C" stroke-width=".7"/>
  <rect x="31" y="4" width="13" height="8" rx="2" fill="#1F8A63" stroke="#E2B33C" stroke-width="1"/>
