<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 12" width="16" height="12">
  <!-- Mosaic sawtooth (dentil) border, after Byzantine mosaic frames: gold and lapis teeth over a vermilion line. Original work. -->
  <rect width="16" height="12" fill="#E2B33C"/>
  <polygon points="0,10 8,1 16,10" fill="#1F45A3"/>
  <polygon points="4,10 8,5.5 12,10" fill="#F7F3E8"/>
  <rect y="10" width="16" height="2" fill="#C2341F"/>
</svg>
