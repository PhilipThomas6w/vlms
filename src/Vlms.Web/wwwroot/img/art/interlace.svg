<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Anglo-Saxon two-colour plait, after the interlace panels of insular manuscripts: gold and vermilion strands alternate over and under, outlined on lapis. Original work. -->
  <rect width="48" height="48" fill="#14254F"/>
  <g fill="none" stroke-linecap="butt">
    <g stroke="#0E1A39" stroke-width="9">
      <path d="M-24 48 L24 0 M0 48 L48 0 M24 48 L72 0 M-24 24 L0 0 M48 72 L72 48 M0 72 L72 0"/>
    </g>
    <g stroke="#C2341F" stroke-width="5.5">
      <path d="M-24 48 L24 0 M0 48 L48 0 M24 48 L72 0 M-24 24 L0 0 M0 72 L72 0"/>
    </g>
    <g stroke="#0E1A39" stroke-width="9">
      <path d="M-24 0 L48 72 M-24 -24 L72 72 M0 -24 L72 48 M24 -24 L72 24 M-24 24 L24 72"/>
    </g>
    <g stroke="#E2B33C" stroke-width="5.5">
      <path d="M-24 0 L48 72 M-24 -24 L72 72 M0 -24 L72 48 M24 -24 L72 24 M-24 24 L24 72"/>
    </g>
    <!-- The vermilion strand passes over at every other crossing, so each strand alternates over and under. -->
    <g stroke="#0E1A39" stroke-width="9"><path d="M6.5 17.5 L17.5 6.5 M30.5 17.5 L41.5 6.5 M6.5 41.5 L17.5 30.5 M30.5 41.5 L41.5 30.5"/></g>
    <g stroke="#C2341F" stroke-width="5.5"><path d="M5.5 18.5 L18.5 5.5 M29.5 18.5 L42.5 5.5 M5.5 42.5 L18.5 29.5 M29.5 42.5 L42.5 29.5"/></g>
  </g>
  <g fill="#C2341F"><circle cx="24" cy="24" r="1.3"/><circle cx="0" cy="0" r="1.3"/><circle cx="48" cy="0" r="1.3"/><circle cx="0" cy="48" r="1.3"/><circle cx="48" cy="48" r="1.3"/></g>
</svg>
