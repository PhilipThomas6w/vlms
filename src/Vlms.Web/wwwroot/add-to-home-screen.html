<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add this app to your home screen</title>
    <link rel="stylesheet" href="/app.css" />
    <meta name="theme-color" content="#14254F" />
</head>

<body>
    <main>
        <h1>Add this app to your home screen</h1>
        <ol>
            <li>In Safari, tap the Share button.</li>
            <li>Tap &ldquo;Add to Home Screen&rdquo;.</li>
            <li>Tap &ldquo;Add&rdquo;.</li>
            <li>Open the app from its new icon on your home screen.</li>
        </ol>
    </main>
</body>

</html>
